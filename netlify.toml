# Build settings
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the backend on Render
# Replace YOUR_BACKEND_URL with your actual Render deployment URL
# e.g. https://aws-assistant-api.onrender.com
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://YOUR_BACKEND_URL.onrender.com/health"
  status = 200
  force = true

# SPA fallback — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
